  <script>
    (function () {
      var burger = document.getElementById("navBurger");
      var menu = document.getElementById("mobileMenu");
      function close() {
        menu.classList.remove("is-open");
        burger.setAttribute("aria-expanded", "false");
        document.documentElement.style.overflow = "";
      }
      burger.addEventListener("click", function () {
        var open = menu.classList.toggle("is-open");
        burger.setAttribute("aria-expanded", String(open));
        document.documentElement.style.overflow = open ? "hidden" : "";
      });
      menu.addEventListener("click", function (e) {
        if (e.target.closest("a")) close();
      });
    })();
  </script>
  <!-- pink year, outside the blend so it stays true #FF0099 -->

  <!-- ===== HERO ===== -->
  <section class="hero" id="hero">
    <div class="hero__sticky" id="heroSticky">

      <!-- video masked by the logo; mirrored copies fill the sides -->
      <div class="hero__video-mask" id="videoMask">
        <div class="hero__video-strip" id="videoStrip">
          <!-- enlarged mirror layer behind -->
          <div class="strip-mirror">
            <div class="vreflect vreflect--left">
              <div class="vreflect vreflect--right">
                <video id="vSlave" class="hero__video" autoplay muted loop playsinline preload="auto">
                  <source src="/gemfest/video/hero-web.mp4" type="video/mp4" />
                </video>
              </div>
            </div>
          </div>
          <!-- sharp central video in front, grows on scroll -->
          <div class="strip-center" id="stripCenter">
            <video id="vMain" class="hero__video" autoplay muted loop playsinline preload="auto">
              <source src="/gemfest/video/hero-web.mp4" type="video/mp4" />
            </video>
          </div>
          <!-- progressive blur: light near centre, heavier to viewport edge -->
          <div class="pblur pblur--1" aria-hidden="true"></div>
          <div class="pblur pblur--2" aria-hidden="true"></div>
          <div class="pblur pblur--3" aria-hidden="true"></div>
          <div class="pblur pblur--4" aria-hidden="true"></div>
          <!-- vignette lives inside the mask: video-only -->
          <div class="vignette" aria-hidden="true"></div>
        </div>
      </div>

      <!-- WebGL icon field (real extruded 3d) -->
      <canvas class="hero__gl" id="gl"></canvas>

      <!-- subtle noise grain -->
      <div class="grain" aria-hidden="true"></div>

    </div>
  </section>
