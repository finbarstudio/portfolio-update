<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PullUp Recordings</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@300,400,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/pullup/styles.css" />
  <style>
    /* ASCII sparkle blooms over the constellation */
    .ascii {
      position: absolute;
      inset: 0;
      z-index: 3;
      margin: 0;
      pointer-events: none;
      overflow: hidden;
      white-space: pre;
      font-family: "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;
      font-weight: 700;
      letter-spacing: 0;
      user-select: none;
      text-rendering: optimizeSpeed;
      color: #ffffff;
      text-shadow: 0 0 6px rgba(255, 255, 255, 0.6);
    }

    /* ----- PullUp sections ----- */
    #site { position: relative; z-index: 5; background: #fff; }
    /* the shared .band has a -100vh overlap (GemFest hero trick) — off here */
    #site .band { margin-top: 0; background: #fff; }
    /* pink tiles (override GemFest blue) */
    .tile--0 { background: linear-gradient(135deg, #C4007A, #FF7ACB); }
    .tile--1 { background: linear-gradient(135deg, #7A0050, #FF0099); }
    .tile--2 { background: linear-gradient(135deg, #FF0099, #FF66C4); }
    .tile--3 { background: linear-gradient(135deg, #FF3DAE, #FFA6D8); }
    .pu-eventdesc { font-size: 0.9rem; color: #5a6478; line-height: 1.5; flex: 1; }
    /* footer wordmark as the logo image */
    .footer-mark-img { width: 100%; height: auto; display: block; }
    .footer.is-armed .footer-mark-img { transform: translateY(120%); }
    .footer.is-armed.is-revealed .footer-mark-img {
      transform: translateY(0);
      transition: transform 1.15s cubic-bezier(0.16, 1, 0.3, 1) 0.9s;
    }
  </style>
</head>
